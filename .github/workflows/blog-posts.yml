name: Update latest blog posts

on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Update README with latest articles
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://sonwwall.github.io/rss.xml'
          max_post_count: 5
          template: '- [$title]($url) — `$date`'
          date_format: 'yyyy-mm-dd'
          commit_message: 'docs: update latest blog posts'
